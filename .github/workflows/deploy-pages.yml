name: Deploy SeaSweep Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Build the seeded demo or point Pages at a live test API"
        required: true
        default: demo
        type: choice
        options:
          - demo
          - live
      api_base:
        description: "Public API base URL for live builds, for example https://api-test.example.com/api"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate live API input
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode == 'live' && github.event.inputs.api_base == '' }}
        run: |
          echo "api_base is required when deployment_mode is set to live." >&2
          exit 1

      - name: Build SeaSweep site
        run: npm run build --workspace apps/web
        env:
          VITE_STATIC_DEMO: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode == 'live' && 'false' || 'true' }}
          VITE_API_BASE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deployment_mode == 'live' && github.event.inputs.api_base || '' }}
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
