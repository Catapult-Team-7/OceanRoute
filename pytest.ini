[pytest]
testpaths = apps/api/tests
pythonpath = apps/api
addopts = -m "not slow and not e2e"
markers =
    slow: long-running tests
    integration: database, filesystem, or multi-service integration tests
    ml: deep-training or inference-runtime tests
    backfill: historical backfill tests
    e2e: full end-to-end workflow tests
