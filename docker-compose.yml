services:
  postgres:
    image: postgres:16
    container_name: oceanroute-postgres
    environment:
      POSTGRES_DB: oceanroute
      POSTGRES_USER: oceanroute
      POSTGRES_PASSWORD: oceanroute
    ports:
      - "5432:5432"
    volumes:
      - oceanroute-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oceanroute -d oceanroute"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  oceanroute-postgres-data:
