services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${SEASWEEP_POSTGRES_DB:-seasweep}
      POSTGRES_USER: ${SEASWEEP_POSTGRES_USER:-seasweep}
      POSTGRES_PASSWORD: ${SEASWEEP_POSTGRES_PASSWORD:-seasweep}
    ports:
      - "5432:5432"
    volumes:
      - seasweep-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  seasweep-postgres-data:
